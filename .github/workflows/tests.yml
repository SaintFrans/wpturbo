name: tests

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.5'
                  tools: composer:v2
                  coverage: none

            # Installs Vite+, Node and the package manager in one step, so no
            # separate setup-node or pnpm setup is needed.
            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
              with:
                  node-version: '24'
                  cache: true

            - name: Setup Application
              run: composer setup

            - name: Run CI Checks
              run: composer ci:check
